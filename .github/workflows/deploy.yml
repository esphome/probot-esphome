name: Deploy main branch

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - uses: actions/setup-node@v1
      with:
        node-version: 14.x
    - run: yarn

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.PROBOT_AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.PROBOT_AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.PROBOT_AWS_REGION }}

    - run: sls deploy --stage=prod
