name: Deploy main branch

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: prod-env

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5  # v2.7.0
    - uses: actions/setup-node@7c12f8017d5436eb855f1ed4399f037a36fbd9e8  # v2.5.2
      with:
        node-version: 14.x
        cache: npm

    - name: Install project dependencies
      run: npm install

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@67fbcbb121271f7775d2e7715933280b06314838  # v1.7.0
      with:
        aws-access-key-id: ${{ secrets.PROBOT_AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.PROBOT_AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.PROBOT_AWS_REGION }}

    - run: 'echo "$PROBOT_ENV_FILE" >.env'
      env:
        PROBOT_ENV_FILE: ${{ secrets.PROBOT_ENV_FILE }}

    - name: Deploy
      run: npm run deploy
